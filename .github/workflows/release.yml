name: Release

on:
  push:
    branches: [main]
    paths: [packages/*/package.json]

jobs:
  publish:
    name: Publish to ${{ marix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        includes:
          - name: github
            url: https://npm.pkg.github.com
            token: ${{ secrets.GITHUB_TOKEN }}
          - name: npm
            url: https://registry.npmjs.org
            token: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          install: true
          registry: ${{ marix.url }}
          runtime: node@lts

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ marix.token }}
        run: |
          # Not really publishing
          #pnpm publish:packages -y --registry '${{ marix.url }}'
